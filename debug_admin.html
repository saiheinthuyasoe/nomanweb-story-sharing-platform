<!DOCTYPE html>
<html>
<head>
    <title>Admin API Debug</title>
</head>
<body>
    <h1>Admin API Debug Tool</h1>
    <div id="results"></div>
    
    <script>
        async function testAdminAPI() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>Testing admin API endpoints...</p>';
            
            try {
                // Check if admin token exists
                const adminToken = localStorage.getItem('adminToken');
                results.innerHTML += `<p><strong>Admin Token:</strong> ${adminToken ? 'Present' : 'Missing'}</p>`;
                
                if (!adminToken) {
                    results.innerHTML += '<p style="color: red;"><strong>ERROR:</strong> No admin token found. Please log in first at <a href="http://localhost:3000/admin/login">Admin Login</a></p>';
                    return;
                }
                
                // Test auth verification
                const authResponse = await fetch('http://localhost:8080/api/admin/auth/verify-admin', {
                    headers: {
                        'Authorization': `Bearer ${adminToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                results.innerHTML += `<p><strong>Auth Verification:</strong> ${authResponse.status} ${authResponse.statusText}</p>`;
                
                if (!authResponse.ok) {
                    const errorText = await authResponse.text();
                    results.innerHTML += `<p style="color: red;"><strong>Auth Error:</strong> ${errorText}</p>`;
                    return;
                }
                
                // Test featured content endpoint
                const contentResponse = await fetch('http://localhost:8080/api/admin/featured-content/NEW_RELEASES?page=0&size=20', {
                    headers: {
                        'Authorization': `Bearer ${adminToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                results.innerHTML += `<p><strong>Featured Content:</strong> ${contentResponse.status} ${contentResponse.statusText}</p>`;
                
                if (!contentResponse.ok) {
                    const errorText = await contentResponse.text();
                    results.innerHTML += `<p style="color: red;"><strong>Content Error:</strong> ${errorText}</p>`;
                } else {
                    const contentData = await contentResponse.json();
                    results.innerHTML += `<p style="color: green;"><strong>Success:</strong> Retrieved ${contentData.content?.length || 0} featured items</p>`;
                }
                
                // Test stats endpoint
                const statsResponse = await fetch('http://localhost:8080/api/admin/featured-content/stats', {
                    headers: {
                        'Authorization': `Bearer ${adminToken}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                results.innerHTML += `<p><strong>Stats Endpoint:</strong> ${statsResponse.status} ${statsResponse.statusText}</p>`;
                
                if (!statsResponse.ok) {
                    const errorText = await statsResponse.text();
                    results.innerHTML += `<p style="color: red;"><strong>Stats Error:</strong> ${errorText}</p>`;
                } else {
                    const statsData = await statsResponse.json();
                    results.innerHTML += `<p style="color: green;"><strong>Stats Success:</strong> ${JSON.stringify(statsData)}</p>`;
                }
                
            } catch (error) {
                results.innerHTML += `<p style="color: red;"><strong>Network Error:</strong> ${error.message}</p>`;
            }
        }
        
        // Run test when page loads
        window.onload = testAdminAPI;
    </script>
</body>
</html>
