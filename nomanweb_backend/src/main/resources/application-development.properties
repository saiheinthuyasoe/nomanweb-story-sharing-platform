# Development Configuration - Optimized for Performance
# This profile reduces logging and optimizes settings to prevent infinite running issues

# Database Configuration - Reduced pool size for development
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# JPA Configuration - Optimized for development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Redis Configuration - Reduced for development
spring.data.redis.lettuce.pool.max-active=5
spring.data.redis.lettuce.pool.max-idle=3
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.timeout=30000ms

# Logging Configuration - Reduced verbosity to prevent performance issues
logging.level.com.app.nomanweb_backend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.hibernate.tool.hbm2ddl=WARN
logging.level.org.springframework.orm.jpa=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.root=INFO

# Server Configuration - Optimized timeouts
server.tomcat.connection-timeout=15000
server.tomcat.keep-alive-timeout=10000
server.tomcat.max-threads=50

# Task Execution - Reduced for development
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=500

# Disable unnecessary features for development
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# Memory optimization
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false